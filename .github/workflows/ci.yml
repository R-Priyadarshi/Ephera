name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit/integration tests
        run: npm test

  full-gates:
    name: full-gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Export Chrome path
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run full standard gates
        run: npm run gates

  relay-required:
    name: relay-required
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Export Chrome path
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Prepare relay env
        env:
          CI_TURN_AUTH_SECRET: ${{ secrets.CI_TURN_AUTH_SECRET }}
        run: |
          cp deploy/turn.env.example deploy/.env
          if [ -n "$CI_TURN_AUTH_SECRET" ]; then
            sed -i "s/^TURN_AUTH_SECRET=.*/TURN_AUTH_SECRET=$CI_TURN_AUTH_SECRET/" deploy/.env
          fi

      - name: Run relay required gate
        run: npm run gates:relay-local
