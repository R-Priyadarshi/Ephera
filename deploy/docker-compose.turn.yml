services:
  turn:
    image: coturn/coturn:4.6.2
    command:
      - -n
      - --no-cli
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_AUTH_SECRET:-change-me-secret}
      - --lt-cred-mech
      - --realm=${TURN_REALM:-ephera.local}
      - --listening-port=${TURN_PORT:-3478}
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49200}
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --stale-nonce=600
      - --log-file=stdout
    ports:
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/tcp"
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/udp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}/udp"
    restart: unless-stopped

  ephera:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      - turn
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ICE_TRANSPORT_POLICY: relay
      TURN_URLS_JSON: >-
        ["turn:${PUBLIC_TURN_HOST:-127.0.0.1}:${TURN_PORT:-3478}?transport=udp","turn:${PUBLIC_TURN_HOST:-127.0.0.1}:${TURN_PORT:-3478}?transport=tcp"]
      TURN_AUTH_SECRET: ${TURN_AUTH_SECRET:-change-me-secret}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-600}
    ports:
      - "${EPHERA_HTTP_PORT:-3000}:3000"
    restart: unless-stopped
